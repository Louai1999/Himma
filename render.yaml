# Render Blueprint: creates the Himma web service and its PostgreSQL database together.
# Render dashboard → New → Blueprint → pick this repository.
# Free plan: the app sleeps when idle, and the free database is deleted after 30 days unless upgraded.

services:
  - type: web
    name: himma
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Connection to the database below (internal network).
      - key: DATABASE_URL
        fromDatabase:
          name: himma-db
          property: connectionString
      # Random signing key generated by Render; never stored in the repository.
      - key: Jwt__Key
        generateValue: true
      # Asked for when the Blueprint is created; typed by you in the Render dashboard.
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false

databases:
  - name: himma-db
    plan: free
    region: frankfurt
    databaseName: himma
    user: himma
