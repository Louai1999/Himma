# Render Blueprint: creates the Himma web service. The database is hosted separately (Supabase).
# Render dashboard → New → Blueprint → pick this repository.
# Free plan: the app sleeps when idle.

services:
  - type: web
    name: himma
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Database connection (e.g. Supabase Session pooler URL). Typed by you in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Apply database updates when the app starts (free plan has no pre-deploy command).
      - key: Database__AutoMigrate
        value: "true"
      # Random signing key generated by Render; never stored in the repository.
      - key: Jwt__Key
        generateValue: true
      # Asked for when the Blueprint is created; typed by you in the Render dashboard.
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false

